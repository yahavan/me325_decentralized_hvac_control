    body {

      margin-bottom: 8px;

      text-align: center;
      color: #64748b;
      font-size: 13px;
      margin-bottom: 36px;
      font-family: 'JetBrains Mono', monospace;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Print optimisation */
    @media print {
      body { background: white; }
      .diagram-wrapper { padding: 0; }
      h1.diagram-title, p.diagram-subtitle { color: #111; }

</head>
